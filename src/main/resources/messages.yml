tokens:
  prefix: "&#03fc88FoKoTH &8» &#a7b8b0"
  theme: "&#03fc88"
  muted: "&#a7b8b0"
  white: "&#ffffff"
  good: "&#3ecf8e"
  bad: "&#ff5d73"

console:
  startup: "{prefix}enabled v{version}"
  shutdown: "{prefix}disabled"
  reload: "{prefix}reloaded config"
  storage-ready: "{prefix}storage ready: {type}"
  storage-failed: "{prefix}storage failed: {error}"
  hook-selected: "{prefix}team hook: {hook}"
  webhook-failed: "{prefix}webhook failed: {error}"
  config-warning: "{prefix}{bad}{message}"

general:
  no-permission: "{prefix}{bad}No permission."
  player-only: "{prefix}{bad}Player only."
  unknown-command: "{prefix}{bad}Unknown command. {muted}Use {theme}{usage}"
  invalid-syntax: "{prefix}{bad}Invalid syntax. {muted}Check command usage."
  invalid-number: "{prefix}{bad}Invalid number. {muted}{hint}"
  invalid-time: "{prefix}{bad}Invalid time. {muted}Use 300, 10h, or 1h30m."
  invalid-mode: "{prefix}{bad}Invalid mode. {muted}Use CAPTURE or SCORE."
  invalid-koth: "{prefix}{bad}Unknown KOTH: {theme}{koth}"
  invalid-player: "{prefix}{bad}Unknown player: {theme}{player}"
  saved: "{prefix}{good}Saved {theme}{setting}{good}."
  cancelled: "{prefix}{muted}Cancelled."
  reload: "{prefix}{good}Reloaded."
  reloaded: "{prefix}{good}Reloaded."
  reload-failed: "{prefix}{bad}Reload failed at {theme}{step}{bad}. {muted}{error}"

admin:
  usage: "{prefix}{bad}Usage: {muted}/{label} {usage}"
  command-missing: "{prefix}{bad}Admin command is missing from plugin.yml: {theme}{command}"
  command-failed: "{prefix}{bad}Command failed. {muted}{error}"
  reload-failed: "{prefix}{bad}Reload failed at {theme}{step}{bad}. {muted}{error}"
  editor-opened: "{prefix}{good}Editor opened."
  version:
    - "{prefix}{theme}FoKoTH {muted}by {white}Carrotio"
    - "{prefix}{muted}Version: {theme}{version}"

native-dialogs:
  unavailable: "{prefix}{bad}Native dialogs unavailable. {muted}Using fallback input."

koth:
  list-empty: "{prefix}{muted}No KOTHs configured."
  list-header: "{prefix}{theme}KOTHs: {white}{koths}"
  info:
    - "{prefix}{theme}{display_name}"
    - "{prefix}{muted}Mode: {white}{mode}"
    - "{prefix}{muted}Active: {white}{active}"
    - "{prefix}{muted}Next: {white}{next}"
  wand-given: "{prefix}{good}Selection wand given."
  wand-pos1: "{prefix}{good}Position 1 set: {theme}{location}"
  wand-pos2: "{prefix}{good}Position 2 set: {theme}{location}"
  wand-missing: "{prefix}{bad}Select both corners with /fokothadmin wand first."
  created: "{prefix}{good}Created KOTH {theme}{koth}{good}."
  deleted: "{prefix}{good}Deleted KOTH {theme}{koth}{good}."
  already-running: "{prefix}{bad}KOTH already running: {theme}{koth}"
  not-running: "{prefix}{bad}KOTH not running: {theme}{koth}"
  started: "{prefix}{good}Started KOTH {theme}{koth}{good}."
  stopped: "{prefix}{good}Stopped KOTH {theme}{koth}{good}."
  stopped-all: "{prefix}{good}Stopped all KOTHs."
  teleported: "{prefix}{good}Teleported to {theme}{koth}{good}."
  starter-given: "{prefix}{good}Gave {theme}{amount}x {koth} {good}starter to {theme}{player}{good}."
  reset-wins: "{prefix}{good}Reset wins for {theme}{player}{good}."
  minimum-players: "{prefix}{bad}Not enough players online. {muted}Need {theme}{minimum}{muted}."
  starter-disabled: "{prefix}{bad}Starter items disabled for {theme}{koth}{bad}."
  start-command-hint: "{prefix}{muted}Use {theme}/fokothadmin start <name>"

broadcasts:
  start: "{prefix}{theme}{display_name} {muted}started. {white}{timeLeft_formatted}"
  started-with-starter: "{prefix}{theme}{display_name} {muted}started by {theme}{starter}{muted}. {white}{timeLeft_formatted}"
  stop: "{prefix}{theme}{display_name} {muted}stopped. {white}{timeTaken_formatted}"
  capture-start: "{prefix}{theme}{capturer} {muted}started capturing {theme}{display_name}{muted}. {white}{timeLeft_formatted}"
  capture-status: "{prefix}{theme}{capturer} {muted}capturing {theme}{display_name}{muted}. {white}{timeLeft_formatted}"
  capture-lost: "{prefix}{theme}{capturer} {muted}lost control of {theme}{display_name}{muted}."
  captured: "{prefix}{theme}{capturer} {good}captured {theme}{display_name}{good}."
  out-of-time: "{prefix}{theme}{display_name} {muted}ended without winner."

editor:
  opened: "{prefix}{theme}Editor opened."
  search-applied: "{prefix}{good}Search applied: {theme}{search}"
  search-cleared: "{prefix}{good}Search cleared."
  added: "{prefix}{good}Added {theme}{entry}{good}."
  already-exists: "{prefix}{bad}Already exists: {theme}{entry}"
  deleted: "{prefix}{good}Deleted {theme}{entry}{good}."
  save-failed: "{prefix}{bad}Could not save {theme}{setting}{bad}. {muted}{error}"
  invalid-input: "{prefix}{bad}Invalid input. {muted}{format}"
  invalid-name: "{prefix}{bad}Invalid name. {muted}Use letters, numbers, - or _."
  invalid-schedule: "{prefix}{bad}Unknown schedule: {theme}{schedule}"
  invalid-cron: "{prefix}{bad}Invalid cron. {muted}{error}"
  invalid-command: "{prefix}{bad}Invalid command. {muted}Enter one console command."
  single-command-only: "{prefix}{bad}Only one command at a time. {muted}Click add again for another command."
  cursor-empty: "{prefix}{bad}Cursor item missing."
  item-required: "{prefix}{bad}Hold an item on your cursor or in your main hand first."
  native-dialog-fallback: "{prefix}{muted}Native dialogs unavailable. Using chat input."

placeholders:
  none: "None"
  inactive: "Inactive"
  active: "Active"
  no-team: "No team"
  no-schedule: "Not scheduled"
